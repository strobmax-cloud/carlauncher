<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Car Launcher 1.3 — симулятор</title>
<style>
@font-face{font-family:RobotoV;src:url(/*FONT_ROBOTO*/) format("woff");font-weight:100 900}
@font-face{font-family:RobotoC;src:url(/*FONT_COND*/) format("woff");font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#111114;color:#fff;font-family:RobotoV,Roboto,"Segoe UI",system-ui,sans-serif;overflow:hidden}
#chrome{height:96px;display:flex;align-items:center;gap:18px;padding:0 20px;background:#1a1a1e;border-bottom:1px solid #2a2a2e;font-size:14px;white-space:nowrap;overflow-x:auto}
#chrome h1{font-size:16px;font-weight:600;margin-right:6px}
#chrome .grp{display:flex;align-items:center;gap:8px}
#chrome .lbl{color:#8E8E93;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tt{width:88px;height:50px;border-radius:9px;border:3px solid transparent;background-size:cover;background-position:center;cursor:pointer;position:relative;display:flex;align-items:flex-end;justify-content:center}
.tt span{font-size:11px;font-weight:600;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:6px;margin-bottom:3px}
.tt.sel{border-color:var(--c)}
#chrome select,#chrome button,#chrome label.btn{background:#2c2c2e;color:#fff;border:0;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}
#chrome label.chk{display:flex;align-items:center;gap:6px;cursor:pointer}
#viewport{position:absolute;left:0;right:0;bottom:0;top:96px;display:flex;align-items:center;justify-content:center}
body.bare #chrome{display:none} body.bare #viewport{top:0}
#stage{width:1280px;height:720px;position:relative;display:flex;flex:none;overflow:hidden;background:#000;transform-origin:center center;border-radius:6px}
body:not(.bare) #stage{box-shadow:0 0 0 10px #050506,0 0 0 11px #2a2a2e}
/* rail */
.rail{width:112px;flex:none;background:#0A0A0C;display:flex;flex-direction:column;align-items:center;padding:16px 0;z-index:2}
.ri{display:flex;flex-direction:column;align-items:center;margin-bottom:14px;cursor:pointer}
.rb{width:80px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.ri.sel .rb{background:#232326}
.rl{font-size:15px;font-weight:500;margin-top:6px;color:#636366}.ri.sel .rl{color:#fff}
.vb{width:80px;height:80px;border-radius:50%;background:#1C1C1E;display:flex;align-items:center;justify-content:center;margin-top:14px;cursor:pointer}
.vb:active{background:#3A3A3C}
/* content area */
.area{position:relative;width:1168px;height:720px;flex:none}
.wall,.dim{position:absolute;inset:0;width:100%;height:100%}
.wall{object-fit:cover}
.wall.cover{filter:blur(36px) brightness(.45) saturate(1.2);transform:scale(1.25)}
.scr{position:absolute;inset:0;display:none}.scr.on{display:block}
.card{background:var(--tint);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--border)}
.glass .card.blur{-webkit-backdrop-filter:blur(26px) saturate(1.15);backdrop-filter:blur(26px) saturate(1.15)}
.press{cursor:pointer}.press:active{filter:brightness(1.25)}
/* home */
.home{display:flex;padding:20px;gap:16px;height:100%}
.lcol{width:320px;flex:none;display:flex;flex-direction:column;gap:16px}
.clock{flex:1;padding:26px 24px 24px 28px;display:flex;flex-direction:column;min-height:0}
.time{line-height:1;letter-spacing:-.02em;white-space:nowrap}
.date{font-size:24px;font-weight:500;margin-top:8px}
.week{display:flex;margin-top:22px}.week>div{flex:1;display:flex;flex-direction:column;align-items:center}
.week .wn{font-size:13px;font-weight:500;letter-spacing:.04em}.week .wd{width:36px;height:36px;margin-top:6px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:500}
.daybar{height:4px;border-radius:2px;display:flex;overflow:hidden;margin-top:auto}
.dayt{font-size:16px;font-weight:500;letter-spacing:.04em;margin-top:10px}
.speed{height:200px;flex:none;padding:18px 20px 18px 28px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.sv{font-size:88px;font-weight:700;line-height:1;letter-spacing:-.02em}.su{font-size:24px;font-weight:500;margin-left:12px;padding-bottom:12px}
.gps{display:flex;align-items:center;gap:8px;font-size:18px;margin-top:8px}
.rcol{width:792px;flex:none;display:flex;flex-direction:column;gap:16px}
.media{flex:1;display:flex;overflow:hidden;min-height:0}
.art{height:100%;aspect-ratio:1/1;flex:none;object-fit:cover;display:block}
.artph{height:100%;aspect-ratio:1/1;flex:none;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center}
.mcol{flex:1;min-width:0;padding:24px 24px 22px 26px;display:flex;flex-direction:column;cursor:pointer}
.src{font-size:15px;font-weight:500;letter-spacing:.1em;color:rgba(255,255,255,.6)}
.ttl{font-size:32px;font-weight:700;margin-top:12px;line-height:1.08;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art2{font-size:21px;color:rgba(255,255,255,.7);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pb{height:5px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}.pf{height:100%;background:#fff;border-radius:3px}
.tms{display:flex;justify-content:space-between;font-size:15px;color:rgba(255,255,255,.6);margin:8px 0 14px}
.ctr{display:flex;align-items:center;justify-content:center;gap:18px}
.cb{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cb:active{background:rgba(255,255,255,.28)}
.pp{width:92px;height:92px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tiles{height:240px;flex:none;display:flex;flex-direction:column;gap:16px}
.trow{flex:1;display:flex;gap:16px}
.tile{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.tile .tl{font-size:17px;font-weight:500;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 6px}
.tile .ni{font-size:13px;color:rgba(255,255,255,.55)}
.tile.blk{align-items:flex-start;justify-content:flex-start;padding:14px 14px 12px 16px;border-radius:var(--r)}
.tile.blk .tl{margin-top:auto;font-size:18px;font-weight:700;padding:0}
.tile.blk.wide .tl{font-size:24px}
.dim40 svg,.dim40 .ri2{opacity:.4}
/* apps */
.pad{padding:20px 20px 0 20px;height:100%;display:flex;flex-direction:column}
.search{height:72px;display:flex;align-items:center;padding:0 24px;border-radius:36px !important;flex:none}
.search input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:26px;margin-left:14px}
.search input::placeholder{color:#636366}
.agrid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;padding:20px 0;overflow:auto}
.acell{height:164px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.acell .al{font-size:19px;font-weight:500;margin-top:10px;text-align:center;padding:0 8px;line-height:1.15}
/* dvr */
.dh{display:flex;align-items:center}.dh h2{font-size:34px;font-weight:700}.dst{font-size:19px;color:#8E8E93;margin-top:6px}
.chips{display:flex;gap:12px;margin-top:16px;flex:none}
.chip{height:64px;padding:0 28px;border-radius:36px;display:flex;align-items:center;font-size:22px;font-weight:500;background:#1C1C1E;cursor:pointer}
.chip.sel{background:var(--accent);color:#fff}
.dlist{overflow:auto;padding:8px 0 20px}
.dhd{font-size:22px;font-weight:700;padding:22px 0 10px 8px}
.drow{height:132px;display:flex;align-items:center;padding:12px 24px 12px 12px;margin-bottom:0;cursor:pointer}
.dthumb{width:192px;height:108px;border-radius:14px;flex:none;background-size:cover}
.dt{font-size:30px;font-weight:700}.dn{font-size:18px;color:#8E8E93;margin-top:8px}.dsz{font-size:20px;color:#8E8E93;font-weight:500;margin-left:auto}
/* settings */
.sset{overflow:auto;height:100%;padding:20px 20px 28px}
.sh{font-size:17px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.75);margin:28px 0 12px 8px;text-transform:uppercase}.sh:first-child{margin-top:4px}
.scard{padding:8px}
.srow{min-height:96px;display:flex;align-items:center;padding:12px 16px 12px 20px;border-radius:20px}
.srow.clk{cursor:pointer}.srow.clk:active{background:rgba(255,255,255,.12)}
.sic{width:60px;height:60px;border-radius:50%;background:#2C2C2E;display:flex;align-items:center;justify-content:center;margin-right:20px;flex:none}
.stt{font-size:25px;font-weight:500}.ssb{font-size:18px;color:#8E8E93;margin-top:6px}
.sw{width:88px;height:52px;border-radius:26px;padding:4px;display:flex;cursor:pointer;flex:none;margin-left:16px}
.sw i{width:44px;height:44px;border-radius:50%;background:#fff;display:block}
.strip{display:flex;gap:12px;padding:14px 12px 10px;overflow-x:auto}
.th{width:200px;flex:none;text-align:center;cursor:pointer}
.thf{height:124px;border-radius:18px;padding:6px;border:4px solid transparent}
.thf canvas{width:100%;height:100%;border-radius:12px;display:block}
.thn{font-size:19px;font-weight:500;margin-top:8px;color:rgba(255,255,255,.7)}.th.sel .thn{color:#fff}
.wp{width:168px;flex:none;text-align:center;cursor:pointer}
.wpf{height:100px;border-radius:16px;padding:5px;background:rgba(255,255,255,.08);border:4px solid transparent}
.wpf div{width:100%;height:100%;border-radius:12px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
.wpn{font-size:17px;font-weight:500;margin-top:8px;color:rgba(255,255,255,.7)}.wp.sel .wpn{color:#fff}
.lt{width:84px;flex:none;cursor:pointer;text-align:center}.lt canvas{width:84px;height:48px;border-radius:8px;border:3px solid transparent;display:block}
.lt span{font-size:11px;font-weight:600;color:#aaa}.lt.sel span{color:#fff}
.abs{position:absolute}.col{display:flex;flex-direction:column}.row{display:flex;align-items:center}
.ico{display:flex;flex-direction:column;align-items:center;cursor:pointer}.ico .il{font-weight:500;margin-top:8px;white-space:nowrap;text-align:center}
.rnd{border-radius:50%;overflow:hidden;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.rnd svg{width:100%;height:100%;transform:scale(1.12)}
.cap{font-weight:700;letter-spacing:.08em}
.chf{clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c))}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th{width:220px}.thf{height:136px}.thd{font-size:14px;color:#8E8E93;margin-top:4px;line-height:1.2}
.toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(40,40,44,.95);padding:14px 26px;border-radius:30px;font-size:20px;display:none;z-index:9}
</style></head>
<body>
<div id="chrome">
  <h1>Car Launcher 1.4</h1>
  <div class="grp"><span class="lbl">Раскладка</span><div id="lthumbs" class="grp"></div></div>
  <div class="grp"><span class="lbl">Тема</span><div id="tthumbs" class="grp"></div></div>
  <div class="grp"><span class="lbl">Обои</span><select id="wsel"></select>
    <label class="btn">Загрузить фон<input id="file" type="file" accept="image/*" hidden></label></div>
  <div class="grp"><label class="chk"><input type="checkbox" id="cov">Обложка как фон</label>
    <label class="chk"><input type="checkbox" id="mus">Музыка играет</label></div>
  <span class="lbl" style="text-transform:none;letter-spacing:0">Работает офлайн · картинки никуда не отправляются</span>
</div>
<div id="viewport"><div id="stage">
  <div class="rail" id="rail"></div>
  <div class="area" id="area">
    <img class="wall" id="wall" alt=""><div class="dim" id="dim"></div>
    <div class="scr" id="s0"></div><div class="scr" id="s1"></div><div class="scr" id="s2"></div><div class="scr" id="s3"></div>
    <div class="toast" id="toast"></div>
  </div>
</div></div>
<script>
/*DATA*/
const $=s=>document.querySelector(s);
const P=new URLSearchParams(location.hash.slice(1));
const S={layout:P.get('layout')||localStorage.cl_layout||'cockpit',theme:P.get('theme')||localStorage.cl_theme||'glass', wall:P.get('wp')||'theme', custom:null, cover:P.get('cover')!=='0',
  playing:(P.get('state')||'playing')!=='idle', screen:+(P.get('screen')||0), track:0, pos:84, speed:62, h24:true, showSpeed:true,
  tiles:[1,1,1,1,1,1,1,1], q:'', day:null, nordicLight:P.get('nordic')!=='dark'};
if(P.get('chrome')==='0') document.body.classList.add('bare');
const TH=()=>DATA.themes.find(t=>t.id===S.theme)||DATA.themes[0];
// ---- icons ----
function lineIcon(n,size,color){const g=DATA.line[n];if(!g)return'';const a=g.stroke?`fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"`:`fill="${color}"`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><path d="${g.d}" ${a}/></svg>`}
let gid=0;
function tileIcon(n,size,op=1){const i=DATA.icons.icons[n];const id='g'+(gid++);
  return `<svg width="${size}" height="${size}" viewBox="0 0 48 48" style="opacity:${op}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${i.c1}"/><stop offset="1" stop-color="${i.c2}"/></linearGradient></defs>
  <path d="${DATA.icons.sq}" fill="url(#${id})"/><path d="${DATA.icons.gloss}" fill="rgba(255,255,255,.08)"/>
  <g transform="translate(10.8 10.8) scale(1.1)"><path d="${i.glyph}" fill="#fff"/></g>${i.rec?'<circle cx="33" cy="15.5" r="2.6" fill="#FF3B30"/>':''}</svg>`}
// Look-alike "real app icons" (mock-up only; on the device the real icons come from Android)
const SQ=DATA.icons.sq;
const REAL={
 ynavi:s=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><path d="${SQ}" fill="#fff"/><path d="M24 9 L36 37 L24 30 L12 37Z" fill="#FF3B30"/><path d="M24 9 L24 30 L12 37Z" fill="#FFCC00"/></svg>`,
 ymusic:s=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><path d="${SQ}" fill="#121212"/><circle cx="24" cy="24" r="13" fill="#FFCC00"/><path d="M21 18v10.5a3.2 3.2 0 1 0 2 3V21h6v-3z" fill="#121212"/></svg>`,
 youtube:s=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><path d="${SQ}" fill="#fff"/><rect x="8" y="14" width="32" height="21" rx="6" fill="#FF0000"/><path d="M21 19.5v10l8.5-5z" fill="#fff"/></svg>`,
 tc:s=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><path d="${SQ}" fill="#FFD60A"/><rect x="11" y="11" width="26" height="26" rx="3" fill="#0A3D91"/><rect x="16" y="11" width="16" height="9" fill="#cfd8e3"/><rect x="15" y="25" width="18" height="12" rx="1" fill="#fff"/></svg>`,
 gis:s=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><path d="${SQ}" fill="#19AA1E"/><text x="24" y="33" font-size="24" font-weight="800" text-anchor="middle" fill="#fff" font-family="RobotoV">2</text></svg>`,
 newpipe:s=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><path d="${SQ}" fill="#CD201F"/><circle cx="24" cy="24" r="11" fill="#fff"/><path d="M21 18.5v11l9-5.5z" fill="#CD201F"/></svg>`,
 scanner:s=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><path d="${SQ}" fill="#0A84FF"/><path d="M12 31a12 12 0 1 1 24 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M24 31l6-8" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`,
 settings:s=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><path d="${SQ}" fill="#8E8E93"/><circle cx="24" cy="24" r="10" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="4 3"/><circle cx="24" cy="24" r="4" fill="#fff"/></svg>`,
 chrome:s=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><path d="${SQ}" fill="#fff"/><circle cx="24" cy="24" r="12" fill="#34A853"/><path d="M24 12a12 12 0 0 1 10.4 6H24z" fill="#EA4335"/><circle cx="24" cy="24" r="5" fill="#4285F4" stroke="#fff" stroke-width="2"/></svg>`,
 gen:(c,l)=>s=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><path d="${SQ}" fill="${c}"/><text x="24" y="31" font-size="20" font-weight="700" text-anchor="middle" fill="#fff" font-family="RobotoV">${l}</text></svg>`,
};
// Tile slots exactly as in Tiles.kt; "real" = what this sample head unit has installed
const TILES=[
 {t:'Навигатор',art:'tile_nav',blk:'#0A6CFF',real:'ynavi',label:'Навигатор'},
 {t:'Радио',art:'tile_radio',blk:'#FF7A00'},
 {t:'Телефон',art:'tile_phone',blk:'#1DB954'},
 {t:'Камера',art:'tile_camera',blk:'#2C2C2E'},
 {t:'Я.Музыка',art:'tile_music',blk:'#FF2D55',real:'ymusic'},
 {t:'YouTube',art:'tile_video',blk:'#E0162B',real:'youtube'},
 {t:'Apple Music',art:'tile_headphones',blk:'#B02BE8',missing:true},
 {t:'Файлы',art:'tile_files',blk:'#0A84FF',real:'tc'}];
const TRACKS=[{src:'ЯНДЕКС МУЗЫКА',t:'Ночная трасса',a:'Демо-исполнитель · Альбом 2026',d:235},
 {src:'ЯНДЕКС МУЗЫКА',t:'Северный ветер',a:'Пример группы · Синглы',d:198},{src:'ЯНДЕКС МУЗЫКА',t:'Неон над Алматы',a:'Тестовый артист · Город',d:262}];
const APPS=[['2ГИС','gis'],['Car Scanner','scanner'],['Chrome','chrome'],['DVR','A:#3A3A3C:D'],['NewPipe','newpipe'],['Total Commander','tc'],
 ['YouTube','youtube'],['АнтиРадар М','A:#FF9F0A:А'],['Bluetooth','A:#1DB954:B'],['Галерея','A:#AF52DE:Г'],['Музыка','A:#FF2D55:М'],['Настройки','settings'],
 ['Радио','A:#FF7A00:Р'],['Яндекс Музыка','ymusic'],['Яндекс Навигатор','ynavi'],['Telegram','A:#2AABEE:T'],['Погода','A:#5AC8FA:П'],['Калькулятор','A:#636366:±']];
function appIcon(k,s){if(k.startsWith('A:')){const[,c,l]=k.split(':');return REAL.gen(c,l)(s)}return REAL[k](s)}
// ---- helpers ----
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1800)}
function wallSrc(){const t=TH();const id=S.wall==='theme'?t.wall:S.wall;return id==='custom'?S.custom:DATA.walls[id]}
function applyTheme(){
  const t=TH(),st=$('#stage');
  st.style.setProperty('--accent',t.accent);st.style.setProperty('--tint',t.tint);st.style.setProperty('--border',t.border);st.style.setProperty('--r',t.radius+'px');
  st.classList.toggle('glass',t.glass);
  $('#dim').style.background=t.dim;
  const cov=S.cover&&S.playing;const w=$('#wall');w.src=cov?DATA.covers[S.track]:wallSrc();w.classList.toggle('cover',cov);
  renderRail();renderHome();renderApps();renderDvr();renderSettings();renderChrome();show(S.screen);
}
function renderRail(){const t=TH();const it=[['ic_home','Главная'],['ic_apps','Прилож.'],['ic_videocam','Записи'],['ic_tune','Настр.']];
  $('#rail').innerHTML=it.map(([n,l],i)=>`<div class="ri ${i===S.screen?'sel':''}" data-i="${i}"><div class="rb">${lineIcon(n,36,i===S.screen?t.accent:'#8E8E93')}</div><div class="rl">${l}</div></div>`).join('')
   +`<div style="flex:1"></div><div class="vb" data-v="+">${lineIcon('ic_vol_up',34,'#fff')}</div><div class="vb" data-v="-">${lineIcon('ic_vol_down',34,'#fff')}</div>`;
  document.querySelectorAll('.ri').forEach(e=>e.onclick=()=>{S.screen=+e.dataset.i;renderRail();show(S.screen)});
  document.querySelectorAll('.vb').forEach(e=>e.onclick=()=>toast(e.dataset.v==='+'?'Громкость +':'Громкость −'));
}
function show(i){for(let k=0;k<4;k++)$('#s'+k).classList.toggle('on',k===i);if(i===0){fitClock();const car=$('#car');if(car&&car.onscroll)car.onscroll()}}
// ---- home ----
function card(cls,solid,blur=true){return solid?`class="${cls}" style="background:${solid};border-radius:var(--r)"`:`class="card ${blur?'blur':''} ${cls}"`}
function renderTiles(){
  const t=TH();const tr=TRACKS[S.track];const fg=t.clockFg;
  const clockFont=t.font==='condensed'?`font-family:RobotoC;font-weight:700`:t.font==='thin'?'font-weight:100':'font-weight:300';
  const vis=TILES.map((x,i)=>i).filter(i=>S.tiles[i]);
  let rows=[];for(let i=0;i<vis.length;i+=4)rows.push(vis.slice(i,i+4));
  const tileH=rows.length?rows.length*112+(rows.length-1)*16:0;
